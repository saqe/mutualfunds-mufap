name: retry-failed-scrape

# A re-run lands on a fresh GitHub-hosted runner, which usually has a different
# IP. That helps when the target site (Cloudflare) blocks a runner's IP.
on:
  workflow_run:
    workflows: [mufap-daily, psx-daily-multiple]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # run_attempt starts at 1; allow up to 3 attempts in total.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          sleep 60
          echo "Attempt $ATTEMPT failed; re-running run $RUN_ID"
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
