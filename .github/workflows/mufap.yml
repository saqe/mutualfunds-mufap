name: mufap-daily

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 14:30 UTC = 19:30 PKT, after NAVs settle
  workflow_dispatch:           # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ai-cloudscraper beautifulsoup4
      - name: Fetch MUFAP data (retry on failure)
        run: |
          for attempt in 1 2 3; do
            if python cloudflare-scraper.py "https://www.mufap.com.pk/Industry/IndustryStatDaily?tab=1" > files/mufap.html; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Fetch failed (attempt $attempt/3); retrying in 10 seconds..."
              sleep 10
            fi
          done
          exit 1
        timeout-minutes: 8

      - name: Commit
        run: |
          git config user.name  "scraping-bot"
          git config user.email "18554574+saqe@users.noreply.github.com"
          git add files/
          git diff --staged --quiet || git commit -m "mufap: $(date -u +%F)"
          git push
