name: mufap-daily

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 14:30 UTC = 19:30 PKT, after NAVs settle
  workflow_dispatch:           # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "curl_cffi[cli]" --upgrade

      - run: curl-cffi get https://www.mufap.com.pk/Industry/IndustryStatDaily?tab=1

