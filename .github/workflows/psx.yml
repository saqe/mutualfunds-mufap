name: psx-daily-multiple

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours, 12AM, 6AM, 12PM, 6PM
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ai-cloudscraper
      - run: python mufap-scraper.py "https://dps.psx.com.pk/screener" > psx.html > latest.html
        timeout-minutes: 2
      

      - name: Commit
        run: |
          git config user.name  "scraping-bot"
          git config user.email "18554574+saqe@users.noreply.github.com"
          git add -A psx.html
          git diff --staged --quiet || git commit -m "datatime: $( date -u +%F_%r)"
          git push
