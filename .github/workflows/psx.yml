name: psx-daily-multiple

on:
  schedule:
    - cron: "30 4,6,8,10 * * 1-5" # 9:30 AM, 11:30 AM, 1:30 PM, 3:30 PM PKT
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ai-cloudscraper
      - run: python cloudflare-scraper.py "https://dps.psx.com.pk/screener" > files/psx.html
        timeout-minutes: 2
      - run: python cloudflare-scraper.py "https://dps.psx.com.pk/etf/MZNPETF" > files/etfs/MZNPETF.html
        timeout-minutes: 2
      - run: python cloudflare-scraper.py "https://dps.psx.com.pk/etf/JSMFETF" > files/etfs/JSMFETF.html
        timeout-minutes: 2

      - name: Commit
        run: |
          git config user.name  "scraping-bot"
          git config user.email "18554574+saqe@users.noreply.github.com"
          git add files/
          git diff --staged --quiet || git commit -m "datatime: $( date -u +%F_%r)"
          git push
